; Het toestel is een M5StickC PLUS SE: ESP32-PICO-D4, 4MB flash,
; ST7789v2 135x240, AXP192 als PMU. Dat is precies wat de board-definitie
; m5stick-c beschrijft (ook PICO-D4 met 4MB), dus die past 1-op-1 -- er is
; in platform-espressif32 geen aparte SE-definitie, en die is ook niet nodig.
;
;   pio run -t upload                    ; standaard: de StickC PLUS SE
;   pio run -e core-basic -t upload      ; als het toch de Core Basic wordt
;
; De firmware zelf leest de schermmaat bij het opstarten uit en past de
; layout aan, dus dezelfde code draait op allebei.

[platformio]
default_envs = stickc

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ ^0.1.16
    https://github.com/ricmoo/QRCode.git
build_flags =
    -DCORE_DEBUG_LEVEL=2

[env:core-basic]
board = m5stack-core-esp32-16M

[env:stickc]
board = m5stick-c
